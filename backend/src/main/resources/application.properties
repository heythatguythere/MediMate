# Server Configuration
server.port=${PORT:8081}
server.address=0.0.0.0

# Actuator endpoints for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mongo.enabled=true

# MongoDB Configuration (using individual properties to avoid @ symbol issues)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/wellness}

# Google OAuth (Optional - not currently used in web app)
google.client.id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URI:http://localhost:8081/oauth2/callback/google}

# Application Settings
spring.application.name=MediMate
# Render/Docker: cwd is /app — file:../frontend-web does not exist and breaks static files.
# Default: JAR classpath only. Local live-reload: MEDIMATE_STATIC_LOCATIONS=file:../frontend-web/,classpath:/static/
spring.web.resources.static-locations=${MEDIMATE_STATIC_LOCATIONS:classpath:/static/}

# Groq AI Configuration
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:llama-3.1-8b-instant}

# Logging Configuration - Enable detailed error logging
logging.level.root=INFO
logging.level.com.medimate=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.mongodb.driver=INFO
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true
